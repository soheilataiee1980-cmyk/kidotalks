function aboutPage(){screen(`<section class="hero about-hero"><div class="hero-brand">${brandMark()}</div><span class="eyebrow">۶ سال همراهی در مسیر آموزش زبان</span><h1>یادگیری با لبخند شروع می‌شود</h1><p class="sub">ما در کیدوتاکس باور داریم اولین تجربه‌های یادگیری زبان باید سرشار از کنجکاوی، آرامش و لذت کشف کردن باشد.</p></section>
<section class="about-story"><h2 class="sec">داستان ما</h2><p>۶ سال است که در حوزهٔ آموزش زبان انگلیسی فعالیت می‌کنیم. در کیدوتاکس، این مسیر را با یک هدف روشن ادامه می‌دهیم: کمک کنیم کودکان با زبان انگلیسی دوست شوند و برای حرف زدن، سؤال پرسیدن و تجربه کردن اعتمادبه‌نفس پیدا کنند.</p><p>برای ما یادگیری فقط حفظ کردن چند کلمه نیست؛ مهم است کودک بتواند چیزهایی را که یاد می‌گیرد در دنیای خودش پیدا کند؛ از اسباب‌بازی مورد علاقه‌اش حرف بزند، وسایل مدرسه‌اش را نام ببرد و کم‌کم جمله‌های خودش را بسازد.</p></section>
<div class="plans about-values"><article class="plan feature"><div class="feature-icon">${featureIcon(0)}</div><h2>هدف ما</h2><p>ساختن تجربه‌ای ساده، شاد و قابل‌فهم از یادگیری انگلیسی؛ تجربه‌ای که کودک در آن با قدم‌های کوچک جلو برود و از پیشرفت خودش لذت ببرد.</p></article><article class="plan feature"><div class="feature-icon">${featureIcon(1)}</div><h2>روش ما</h2><p>ترکیب تصویر، شنیدن، بازی و تکرار در تمرین‌های کوتاه. درس‌ها به بخش‌های کوچک تقسیم شده‌اند تا کودک فرصت داشته باشد یاد بگیرد، امتحان کند و دوباره تمرین کند.</p></article><article class="plan feature"><div class="feature-icon">${featureIcon(2)}</div><h2>نگاه ما به پیشرفت</h2><p>هر کودک با سرعت خودش یاد می‌گیرد. ستاره‌ها و کارنامهٔ مهارت‌ها برای تشویق تلاش و نشان دادن مسیر تمرین هستند؛ هر اشتباه، فرصتی برای یادگیری بیشتر است.</p></article></div>
<section class="about-story parent-note"><h2 class="sec">همراه کودک، کنار والدین</h2><p>می‌خواهیم والدین هم بدانند کودکشان چه چیزی را تمرین می‌کند و کجا به همراهی بیشتری نیاز دارد. در کارنامهٔ مهارت‌ها می‌توانید پیشرفت او را در واژگان، شنیداری، جمله‌سازی و خواندن ببینید.</p><p>گاهی چند دقیقه همراهی کافی است: با هم یک فلش‌کارت را ببینید، یک کلمه را تکرار کنید یا دربارهٔ رنگ و اسباب‌بازی مورد علاقه‌اش سؤال بپرسید. همین گفت‌وگوهای کوچک می‌توانند تمرین زبان را به لحظه‌ای خوشایند تبدیل کنند.</p></section>

      say(kind==="pick"?q.w:`It's ${art(q.w)} ${q.w}.`);wait(()=>{i++;i<qs.length?show():result(kind,miss)},1400)}
    else{miss++;wr++;sfx(0);b.classList.add("shake");wait(()=>b.classList.remove("shake"),400);document.getElementById("m").textContent="Try again!";
      say(kind==="pick"?q.w:"What's this?");

function match(r,previousMiss=0){
  const L=r?R2:R1;let miss=previousMiss,sel=null,left=L.length;const rt=shuffle(L);
  screen(`<div class="sub">تصویر را به کلمه‌اش وصل کن (اول تصویر، بعد کلمه)</div><div class="msg" id="m"></div><div class="row"><div class="col">${L.map(w=>`<button class="pic" data-p="${w}" style="min-height:76px">${img(w)}</button>`).join("")}</div><div class="col">${rt.map(w=>`<button class="en" data-w="${w}" style="min-height:76px;font-size:22px">${w}</button>`).join("")}</div></div>`,"home()");
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-p]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;say(b.dataset.p)});
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    if(!sel)return;
    if(sel.dataset.p===b.dataset.w){[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.onclick=null;x.disabled=true});say(b.dataset.w);sfx(1);sel=null;left--;

function memory(){

function sourcePages(kind='SB',lesson=1){const d=COURSE[UNIT];if(!d||!['SB','WB'].includes(kind)||lesson<1||lesson>8)return;INGAME=true;const page=d.page+lesson-1,src=SOURCE_PAGES[UNIT][kind][lesson-1];screen(`<h1 class="en">Unit ${UNIT} · ${lesson<=6?'Lesson '+lesson:'Extra '+(lesson-6)}</h1><p class="sub">${kind==='SB'?'Student Book':'Workbook'} · صفحهٔ چاپی ${page} · تصویرِ عین صفحهٔ PDF ارسالی</p><div class="row source-controls"><label for="source-kind">کتاب</label><select id="source-kind" onchange="sourcePages(this.value,${lesson})"><option value="SB" ${kind==='SB'?'selected':''}>Student Book</option><option value="WB" ${kind==='WB'?'selected':''}>Workbook</option></select><label for="source-lesson">درس</label><select id="source-lesson" onchange="sourcePages('${kind}',Number(this.value))">${[1,2,3,4,5,6,7,8].map(x=>`<option value="${x}" ${lesson===x?'selected':''}>${x<=6?'درس '+x:'تکمیلی '+(x-6)} · صفحه ${d.page+x-1}</option>`).join('')}</select></div>${src?`<div class="source-scroll" tabindex="0" aria-label="صفحهٔ کتاب؛ برای بزرگ‌نمایی از دکمه استفاده کن"><img id="source-image" class="source-image" src="${src}" alt="${kind} Unit ${UNIT} Lesson ${lesson}, printed page ${page}"></div><button id="source-zoom" aria-pressed="false" onclick="const i=document.getElementById('source-image');const z=this.getAttribute('aria-pressed')!=='true';i.classList.toggle('zoomed',z);this.setAttribute('aria-pressed',String(z));this.textContent=z?'نمای کامل صفحه':'بزرگ‌نمایی صفحه'">بزرگ‌نمایی صفحه</button>`:`<div class="lesson-note">${d.sourceNote}</div><button onclick="sourcePages('WB',${lesson})">دیدن همین درس در ورک‌بوک</button>`}<div class="row"><button ${lesson===1?'disabled':''} onclick="sourcePages('${kind}',${lesson-1})">درس قبلی</button><button ${lesson===8?'disabled':''} onclick="sourcePages('${kind}',${lesson+1})">درس بعدی</button></div><label for="source-notes">پاسخ‌ها یا یادداشت من دربارهٔ این صفحه</label><textarea id="source-notes" class="course-notebook en" maxlength="4000" placeholder="Write your answers here..."></textarea><button id="source-save">ذخیرهٔ یادداشت این صفحه</button><p id="source-status" role="status"></p><p class="sub">یادداشت فقط در همین مرورگر نگه‌داری می‌شود و تصحیح خودکار ندارد. می‌توانی تمرین اصلی را روی کاغذ یا در کتاب هم انجام بدهی.</p>`,'go(\'lessons\')');const key=`kidotalk-source-${UNIT}-${kind}-${page}`;window.KIDO_SOURCE_NOTE=key;document.getElementById('source-notes').value=getNote(key);document.getElementById('source-save').onclick=()=>{try{setNote(key,document.getElementById('source-notes').value);document.getElementById('source-status').textContent='یادداشت این صفحه ذخیره شد.'}catch(e){document.getElementById('source-status').textContent='مرورگر اجازهٔ ذخیره نداد؛ متن را کپی کن.'}}}
skillReportData=function(){if(UNIT<4)return oldSkillsCourse();return [['واژگان','Vocabulary','🧩',['what','match','mem'],'شناخت معنی واژه‌ها و بازی جفت‌ها'],['شنیداری','Listening','🎧',['pick','listen'],'شناخت واژه و جمله با صدای سایت'],['گرامر و جمله‌سازی','Grammar','💬',['blank','order'],'ساختارهای اختصاصی همین یونیت'],['فونیکس و خواندن','Reading & Phonics','📖',['abcd','read','readwb'],'الگوهای حروف و درک دو متن'],['آمادگی نوشتن','Writing preparation','✏️',['mechanics','spell'],'نکتهٔ نوشتاری کتاب و املای واژه‌ها']]};
start=function(k){if(UNIT<4)return oldStartCourse(k);if(!COURSE_ACTS.some(a=>a[0]===k))return;INGAME=true;TAB=k==='cards'?'lessons':'practice';if(k==='cards')return cards();if(k==='order')return courseOrder();if(k==='spell')return courseSpell();if(k==='match')return courseMatch();if(k==='mem')return courseMemory();mc(k,courseQuestions(k))};
function cq(prompt,ok,wrong1,wrong2,hint='پاسخ درست را انتخاب کن.'){return {hint,top:`<p class="reading en">${escCourse(prompt)}</p>`,o:shuffle([ok,wrong1,wrong2]).map(s=>[cleanCourse(s),escCourse(s)]),ok:cleanCourse(ok)}}
function courseQuestions(key){const d=COURSE[UNIT];
 if(['what','pick'].includes(key))return d.vocab.map(([w,fa])=>{const opts=shuffle([w,...shuffle(ALL.filter(v=>v!==w)).slice(0,2)]);return {hint:key==='pick'?'صدا را بشنو و معنی درست را انتخاب کن.':'معنی این واژه کدام است؟',top:key==='pick'?`<button data-t="${escCourse(w)}">🔊 دوباره گوش کن</button>`:`<p class="reading en">${escCourse(w)}</p>`,say:key==='pick'?w:null,o:opts.map(x=>[x,escCourse(WD[x][0])]),ok:w,sayOk:w}});
 if(key==='blank')return d.grammar.map(([p,a,b,c,h])=>({...cq(p,a,b,c,h),sayOk:cleanCourse(p.includes('___')?p.replace('___',a):a)}));
 if(key==='mechanics')return d.edit.map(([p,a,b,c])=>cq(p,a,b,c,d.mechanic));
 if(['read','readwb'].includes(key)){const r=d[key];return r[1].map(([p,a,b,c])=>({...cq(p,a,b,c,'متن را بخوان و پاسخ بده.'),top:`<p class="reading en reading-question">${escCourse(r[0])}</p><p class="reading en">${escCourse(p)}</p>`}))}
 if(key==='listen'){const sentences=d.models.map(x=>cleanCourse(x[0]));return sentences.map(s=>({hint:'جمله یا گفت‌وگو را بشنو؛ همان متن را انتخاب کن.',top:`<button data-t="${escCourse(s)}">🔊 دوباره گوش کن</button><p class="sub">اگر صدا پخش نشد، تنظیم صدای مرورگر را بررسی کن یا این تمرین را بعداً انجام بده.</p>`,say:s,ok:s,o:shuffle([s,...shuffle(sentences.filter(x=>x!==s)).slice(0,2)]).map(x=>[x,escCourse(x)]),sayOk:s}))}
 if(key==='abcd'){
  if(UNIT===7)return [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map((c,i)=>cq(c,c.toLowerCase(),'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[(i+1)%26].toLowerCase(),'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[(i+7)%26].toLowerCase(),'حرف کوچک را پیدا کن.')).concat([['A B ___ D','C','E','F'],['K L ___ N','M','P','Q'],['U V ___ X','W','Y','Z']].map(x=>cq(...x,'حرف جاافتاده را پیدا کن.')));
  return d.ph.map(([sound,w])=>{const at=w.toLowerCase().indexOf(sound);const choices=UNIT<=6?[sound,...'abcdefghijklmnopqrstuvwxyz'.split('').filter(s=>s!==sound).slice(0,2)]:sound.length===2?[sound,...['sh','ch','th'].filter(s=>s!==sound)]:[sound,...['a','e','i','o','u'].filter(s=>s!==sound).slice(0,2)];return {...cq(w.slice(0,at)+'_'.repeat(sound.length)+w.slice(at+sound.length),...choices,'کلمه را بشنو و حرف یا ترکیب جاافتاده را پیدا کن.'),top:`<p class="reading en">${w.slice(0,at)+'_'.repeat(sound.length)+w.slice(at+sound.length)}</p><button data-t="${w}">🔊 تلفظ کلمه</button>`,say:w,sayOk:w}});
 }
 throw Error('Unknown course exercise '+key);
}
function courseOrder(){const items=COURSE[UNIT].models.map(x=>cleanCourse(x[0]).split(/(?<=[.!?])\s+/)[0]);let i=0,miss=0;function show(){const sentence=items[i],tokens=sentence.split(' ');let picked=[],locked=false;screen(`${progressBar(i/items.length*100)}<p>جملهٔ اولِ این الگو را از چپ به راست بساز. به حرف بزرگ و نشانهٔ پایان توجه کن.</p><p>${escCourse(COURSE[UNIT].models[i][1])}</p><div class="slots en" id="course-slots" aria-live="polite"></div><div class="row en">${shuffle(tokens.map((w,j)=>[w,j])).map(([w,j])=>`<button class="course-piece" data-index="${j}">${escCourse(w)}</button>`).join('')}</div><div class="row"><button id="course-undo">یک کلمه برگرد</button><button id="course-check">بررسی جمله</button></div><p id="course-feedback" role="status"></p>`,'go(\'practice\')');const buttons=[...document.querySelectorAll('.course-piece')],draw=()=>document.getElementById('course-slots').textContent=picked.map(j=>tokens[j]).join(' ');buttons.forEach(b=>b.onclick=()=>{if(locked||b.disabled)return;picked.push(+b.dataset.index);b.disabled=true;draw()});document.getElementById('course-undo').onclick=()=>{if(locked)return;const j=picked.pop();if(j!==undefined)buttons.find(b=>+b.dataset.index===j).disabled=false;draw()};document.getElementById('course-check').onclick=()=>{if(locked)return;if(picked.length!==tokens.length)return toast('همهٔ کلمه‌ها را انتخاب کن.');if(picked.map(j=>tokens[j]).join(' ')===sentence){locked=true;say(sentence);document.getElementById('course-feedback').textContent='آفرین! جمله درست است.';wait(()=>++i<items.length?show():result('order',miss),1000)}else{miss++;document.getElementById('course-feedback').textContent='ترتیب را دوباره بررسی کن.';if(miss>=3)document.getElementById('course-feedback').textContent+=' راهنما: '+sentence}}}show()}
function courseSpell(){let i=0,miss=0;const words=shuffle([...ALL]);function show(){const w=words[i];let locked=false;screen(`${progressBar(i/words.length*100)}<h1>کلمه را بنویس</h1><p>${escCourse(WD[w][0])}</p><button data-t="${escCourse(w)}">🔊 تلفظ</button><label for="course-spelling">املای انگلیسی</label><input id="course-spelling" class="en" autocomplete="off" spellcheck="false" maxlength="50"><button id="course-spell-check">بررسی</button><p id="course-feedback" role="status"></p>`,'go(\'practice\')');const input=document.getElementById('course-spelling'),check=document.getElementById('course-spell-check');check.onclick=()=>{if(locked)return;const s=input.value.trim().toLowerCase().replace(/\s+/g,' ');if(!s)return toast('اول کلمه را بنویس.');if(s===w.toLowerCase()){locked=true;check.disabled=true;document.getElementById('course-feedback').textContent='آفرین!';say(w);wait(()=>++i<words.length?show():result('spell',miss),900)}else{miss++;document.getElementById('course-feedback').textContent='دوباره بنویس؛ راهنما: '+w}};input.onkeydown=e=>{if(e.key==='Enter')check.onclick()}}show()}
function courseMatch(){let round=0,miss=0;const chunks=[];for(let j=0;j<ALL.length;j+=4)chunks.push(ALL.slice(j,j+4));function show(){const ws=chunks[round];let selected=null,done=new Set();screen(`${progressBar(round/chunks.length*100)}<h1>دوستِ هر کلمه را پیدا کن</h1><p>اول کلمهٔ انگلیسی و بعد معنی فارسی آن را انتخاب کن.</p><div class="course-pairs"><div>${shuffle(ws).map(w=>`<button class="pair-en en" data-word="${escCourse(w)}">${escCourse(w)}</button>`).join('')}</div><div>${shuffle(ws).map(w=>`<button class="pair-fa" data-word="${escCourse(w)}">${escCourse(WD[w][0])}</button>`).join('')}</div></div><p id="course-feedback" role="status"></p>`,'go(\'practice\')');const en=[...document.querySelectorAll('.pair-en')],fa=[...document.querySelectorAll('.pair-fa')];en.forEach(b=>b.onclick=()=>{if(done.has(b.dataset.word))return;selected=b.dataset.word;en.forEach(x=>x.classList.remove('picked'));b.classList.add('picked')});fa.forEach(b=>b.onclick=()=>{if(!selected||done.has(b.dataset.word))return;if(b.dataset.word===selected){done.add(selected);en.find(x=>x.dataset.word===selected).disabled=true;b.disabled=true;selected=null;sfx(1);document.getElementById('course-feedback').textContent='درست پیدا کردی!';if(done.size===ws.length)wait(()=>++round<chunks.length?show():result('match',miss),700)}else{miss++;sfx(0);document.getElementById('course-feedback').textContent='معنی دیگری را امتحان کن.'}})}show()}
function courseMemory(){const words=shuffle([...ALL]).slice(0,6);const deck=shuffle(words.flatMap((w,i)=>[{pair:i,label:w},{pair:i,label:WD[w][0]}]));let first=null,lock=false,miss=0,done=new Set();screen(`<h1>حافظهٔ کلمه و معنی</h1><p>هر واژهٔ انگلیسی را به معنی فارسی‌اش وصل کن.</p><div class="course-memory">${deck.map((_,i)=>`<button class="memory-course" data-index="${i}" aria-label="کارت بسته ${i+1}">?</button>`).join('')}</div><p id="course-feedback" role="status">۰ از ۶ جفت</p>`,'go(\'practice\')');const bs=[...document.querySelectorAll('.memory-course')];bs.forEach(b=>b.onclick=()=>{const i=+b.dataset.index;if(lock||done.has(i)||i===first)return;b.textContent=deck[i].label;b.setAttribute('aria-label',deck[i].label);if(first===null){first=i;return}const a=first;first=null;lock=true;if(deck[a].pair===deck[i].pair){done.add(a);done.add(i);bs[a].disabled=true;b.disabled=true;lock=false;document.getElementById('course-feedback').textContent=`${done.size/2} از ۶ جفت`;if(done.size===12)wait(()=>result('mem',miss),700)}else{miss++;wait(()=>{[a,i].forEach(j=>{bs[j].textContent='?';bs[j].setAttribute('aria-label',`کارت بسته ${j+1}`)});lock=false},1100)}})}
function courseWriting(){INGAME=true;const d=COURSE[UNIT],key='kidotalk-writing-'+UNIT;screen(`<h1>دفتر نوشتن من ✏️</h1><p>${d.write}</p><div class="lesson-note">${d.mechanic}</div><label for="course-writing">جمله‌های من</label><textarea id="course-writing" class="course-notebook en" maxlength="2000" placeholder="Write your sentences here..."></textarea><div class="row"><button id="course-writing-save">ذخیرهٔ نوشته</button><button id="course-writing-read">🔊 نوشته‌ام را بخوان</button></div><p id="course-writing-status" role="status"></p><details class="plan"><summary>جملهٔ نمونه</summary><p class="reading en">${escCourse(d.sample)}</p></details><p>بازبینی با همراه: واژه‌ها درست نوشته شده‌اند؟ ساختار جمله با الگوی درس هماهنگ است؟ حرف بزرگ و نشانهٔ پایان را گذاشته‌ام؟</p><p class="sub">این فعالیت آزاد است؛ صدای سایت متن را می‌خواند و درستی معنی یا گرامر را ارزیابی نمی‌کند. نوشته فقط در همین مرورگر ذخیره می‌شود.</p>${courseSourceButtons(6)}`,'go(\'lessons\')');const input=document.getElementById('course-writing');input.value=getNote(key);document.getElementById('course-writing-save').onclick=()=>{try{setNote(key,input.value);document.getElementById('course-writing-status').textContent='نوشته‌ات ذخیره شد.'}catch(e){document.getElementById('course-writing-status').textContent='ذخیره نشد؛ متن را کپی کن.'}};document.getElementById('course-writing-read').onclick=()=>{if(input.value.trim())say(input.value.trim());else toast('اول جمله‌ات را بنویس.')}}
function courseSpeaking(){INGAME=true;const d=COURSE[UNIT];screen(`<h1>نوبت حرف زدن من 💬</h1><div class="lesson-note">${d.talk}</div><div class="list">${d.models.map(([s,fa])=>`<button class="act" data-t="${escCourse(cleanCourse(s))}" style="--c:#e9f5ef"><span class="ic">🔊</span><span class="t"><b>${escCourse(s)}</b>${fa}</span></button>`).join('')}</div><p>۱. الگو را گوش کن. ۲. با واژه‌های همین یونیت جملهٔ تازه بگو. ۳. نقش‌ها را عوض کنید.</p><p class="sub">این تمرین دونفره است؛ صدا ضبط یا نمره‌گذاری نمی‌شود.</p>`,'go(\'lessons\')')}

function pictureMatch(){const words=practiceWords(),parts=[];for(let i=0;i<words.length;i+=4)parts.push(words.slice(i,i+4));let round=0,miss=0;startAttempt('match',words.length);function show(){const ws=parts[round];let selected=null,done=new Set();screen(`${progressBar(round/parts.length*100)}<h1>تصویر و کلمه را وصل کن</h1><div class="course-pairs"><div>${shuffle(ws).map(w=>`<button class="pair-picture pic" data-word="${E(w)}">${picture(w)}</button>`).join('')}</div><div>${shuffle(ws).map(w=>`<button class="pair-word en" data-word="${E(w)}">${E(w)}</button>`).join('')}</div></div><p id="m" role="status"></p>`,'go(\'practice\')');const left=[...document.querySelectorAll('.pair-picture')],right=[...document.querySelectorAll('.pair-word')];left.forEach(b=>b.onclick=()=>{selected=b.dataset.word;left.forEach(x=>x.classList.remove('picked'));b.classList.add('picked');say(selected)});right.forEach(b=>b.onclick=()=>{if(!selected||done.has(b.dataset.word))return;const q=visualQuestion(selected);if(selected===b.dataset.word){noteAnswer('match',q,true,!ATTEMPT.wrong.has(selected));done.add(selected);left.find(x=>x.dataset.word===selected).disabled=true;b.disabled=true;selected=null;if(done.size===ws.length)wait(()=>++round<parts.length?show():result('match',miss),600)}else{miss++;ATTEMPT.wrong.add(selected);noteAnswer('match',q,false,false);document.getElementById('m').textContent='کلمهٔ دیگری را امتحان کن.'}})}show()}

function validateImport(data){if(!data||data.app!=='Kidotalk'||data.version!==2||!Array.isArray(data.profiles)||!data.profiles.length||data.profiles.length>8)throw Error('این فایل، پشتیبان معتبر Kidotalks نیست.');const clean=[];for(const x of data.profiles){if(!x||typeof x.name!=='string'||x.name.length>24||!x.units||typeof x.units!=='object')throw Error('ساختار پروفایل معتبر نیست.');const p=blankProfile(x.name,['🦊','🐼','🐰','🦁','🐨','🐸'].includes(x.avatar)?x.avatar:'🦊');for(let u=1;u<=15;u++){p.units[u]={_scale:5};for(const [k,v] of Object.entries(x.units[u]||{}))if(/^[a-z]{2,20}$/.test(k)&&Number.isFinite(v)&&v>=0&&v<=5)p.units[u][k]=v}for(const [k,v] of Object.entries(x.notes||{}).slice(0,400))if(/^kidotalk-(source|writing)-/.test(k)&&typeof v==='string'&&v.length<=4000)p.notes[k]=v;for(const [id,m] of Object.entries(x.mistakes||{}).slice(0,500)){const q=m&&m.q;if(!q||!Number.isInteger(m.unit)||m.unit<1||m.unit>15||!Array.isArray(q.options)||q.options.length<2||q.options.length>4||typeof q.ok!=='string'||q.ok.length>400)continue;if(!q.options.every(o=>Array.isArray(o)&&o.length===2&&o.every(v=>typeof v==='string'&&v.length<=400))||!q.options.some(o=>o[0]===q.ok))continue;p.mistakes[id.replace(/[^a-z0-9-]/gi,'').slice(0,60)]={id:String(id).slice(0,60),unit:m.unit,key:String(m.key||'review').slice(0,20),label:String(m.label||'').slice(0,100),misses:Math.min(1000,Math.max(1,Number(m.misses)||1)),streak:Math.min(2,Math.max(0,Number(m.streak)||0)),last:Date.now(),q:{hint:String(q.hint||'').slice(0,400),prompt:String(q.prompt||'').slice(0,1800),options:q.options,ok:q.ok,say:String(q.say||'').slice(0,1200),visual:String(q.visual||'').slice(0,40)}}}p.history=(Array.isArray(x.history)?x.history:[]).filter(h=>Number.isInteger(h.unit)&&h.unit>=1&&h.unit<=15&&Number.isFinite(h.accuracy)&&h.accuracy>=0&&h.accuracy<=100&&Number.isFinite(h.date)).slice(-500).map(h=>({unit:h.unit,key:String(h.key||'').slice(0,20),accuracy:h.accuracy,total:Math.max(1,Math.min(200,Number(h.total)||1)),date:h.date}));const u=Number(x.route&&x.route.unit);p.route={unit:u>=1&&u<=15?u:1,tab:'lessons',lesson:1};p.daily=Object.fromEntries(Object.entries(x.daily||{}).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&Number.isFinite(v.accuracy)).slice(-366).map(([k,v])=>[k,{unit:Math.min(15,Math.max(1,Number(v.unit)||1)),accuracy:Math.min(100,Math.max(0,v.accuracy))}]));clean.push(p)}return clean}
function backupImportPage(){screen(`<h1>بازگرداندن پشتیبان</h1><p>پروفایل‌ها به‌عنوان کودک جدید اضافه می‌شوند؛ اطلاعات فعلی پاک نمی‌شوند.</p><label for="backup-file">فایل JSON پشتیبان</label><input type="file" id="backup-file" accept=".json,application/json"><p id="import-status" role="status"></p><button id="import-confirm" disabled>افزودن پروفایل‌ها</button><button onclick="go('parents')">بازگشت</button>`);document.getElementById('backup-file').onchange=async e=>{const f=e.target.files[0];PENDING_IMPORT=null;document.getElementById('import-confirm').disabled=true;if(!f)return;try{if(f.size>8*1024*1024)throw Error('فایل بزرگ‌تر از حد مجاز است.');const data=JSON.parse(await f.text()),ps=validateImport(data);PENDING_VIDEOS={};for(let u=1;u<=15;u++)if(Array.isArray(data.videos&&data.videos[u]))PENDING_VIDEOS[u]=data.videos[u].slice(0,20).filter(v=>v&&typeof v.title==='string'&&validVideoURL(v.url)).map(v=>({title:v.title.slice(0,100),url:validVideoURL(v.url),lesson:Number.isInteger(v.lesson)&&v.lesson>=1&&v.lesson<=7?v.lesson:null,note:'انتخاب خانواده'}));if(ps.length+KDB.profiles.length>8)throw Error('با این فایل بیش از ۸ پروفایل خواهید داشت.');PENDING_IMPORT=ps;document.getElementById('import-status').textContent='آمادهٔ افزودن: '+ps.map(p=>p.name).join('، ');document.getElementById('import-confirm').disabled=false}catch(err){document.getElementById('import-status').textContent=err.message}};document.getElementById('import-confirm').onclick=()=>{if(!PENDING_IMPORT)return;KDB.profiles.push(...PENDING_IMPORT);for(const [u,vs] of Object.entries(PENDING_VIDEOS)){const existing=KDB.videos[u]||[];KDB.videos[u]=[...existing,...vs.filter(v=>!existing.some(x=>x.url===v.url))].slice(0,20)}PENDING_IMPORT=null;PENDING_VIDEOS={};persist();profilePage()}}

courseOrder=function(){const items=orderItems();let i=0;startAttempt('order',items.length);function show(){const sentence=items[i],tokens=sentence.split(' ');let picked=[],locked=false;const other=tokens.slice().reverse().join(' ');const review={hint:'جملهٔ درست را پیدا کن.',top:COURSE[UNIT].models[i][1],o:[[sentence,sentence],[other,other]],ok:sentence};screen(`${progressBar(i/items.length*100)}<h1>جمله را بساز</h1><p>${E(COURSE[UNIT].models[i][1])}</p><div class="slots en" id="course-slots" aria-live="polite"></div><div class="row en">${shuffle(tokens.map((w,j)=>[w,j])).map(([w,j])=>`<button class="course-piece" data-index="${j}">${E(w)}</button>`).join('')}</div><div class="row"><button id="course-undo">یک کلمه برگرد</button><button id="course-check">بررسی جمله</button></div><p id="course-feedback" role="status"></p>`,'go(\'practice\')');const bs=[...document.querySelectorAll('.course-piece')],draw=()=>document.getElementById('course-slots').textContent=picked.map(j=>tokens[j]).join(' ');bs.forEach(b=>b.onclick=()=>{if(locked||b.disabled)return;picked.push(+b.dataset.index);b.disabled=true;draw()});document.getElementById('course-undo').onclick=()=>{if(locked)return;const j=picked.pop();if(j!==undefined)bs.find(b=>+b.dataset.index===j).disabled=false;draw()};document.getElementById('course-check').onclick=()=>{if(locked)return;if(picked.length!==tokens.length)return toast('همهٔ کلمه‌ها را انتخاب کن.');if(picked.map(j=>tokens[j]).join(' ')===sentence){locked=true;noteAnswer('order',review,true,!ATTEMPT.wrong.has(i)&&!ATTEMPT.assisted.has(i));document.getElementById('course-feedback').textContent='آفرین!';say(sentence);wait(()=>++i<items.length?show():result('order'),800)}else{ATTEMPT.wrong.add(i);noteAnswer('order',review,false,false);document.getElementById('course-feedback').textContent='جمله را دوباره بچین.';picked=[];bs.forEach(b=>b.disabled=false);draw()}}}show()};

mc=function(key,items){if(!items.length)return toast('فعلاً سؤالی برای این بخش نیست.');startAttempt(key,items.length);let i=0;function show(){const q=items[i];let tries=0,locked=false;screen(`<div class="quiz-heading"><span>${E(activityLabel(key))}</span><b>سؤال ${i+1} از ${items.length}</b></div>${progressBar(i/items.length*100)}<h2 class="question-instruction">${E(q.hint||'پاسخ درست را انتخاب کن.')}</h2><section class="question-scene">${q.top}</section><div class="opts g${q.o.length}">${q.o.map((o,j)=>`<button class="opt answer-choice" data-choice="${j}" data-o="${E(o[0])}"><span class="choice-number">${j+1}</span><span>${o[1]}</span></button>`).join('')}</div><div id="m" class="answer-feedback" role="status" aria-live="polite"></div><button id="next-question" class="cta" hidden>${i===items.length-1?'دیدن نتیجه':'سؤال بعدی'}</button>`,'go(\'lessons\')');if(q.say)say(q.say);const next=document.getElementById('next-question');next.onclick=()=>{if(!locked)return;++i<items.length?show():result(key)};document.querySelectorAll('.answer-choice').forEach(b=>b.onclick=()=>{if(locked||b.disabled)return;const correct=b.dataset.o===q.ok;if(correct){locked=true;document.querySelectorAll('.answer-choice').forEach(x=>x.disabled=true);noteAnswer(key,q,true,tries===0);ATTEMPT.done++;b.classList.add('ok');const feedback=key==='blank'?(TEACH_TIPS[UNIT]||[]).join(' '):q.sayOk?plain(q.sayOk):plain(q.o.find(x=>x[0]===q.ok)[1]);document.getElementById('m').textContent='✓ درست بود! '+feedback;next.hidden=false;sfx(1);if(q.sayOk)say(q.sayOk)}else{tries++;ATTEMPT.wrong.add(i);noteAnswer(key,q,false,false);b.disabled=true;b.classList.add('wrong');document.getElementById('m').textContent=key==='read'||key==='readwb'?'هنوز درست نیست. جملهٔ مربوط به سؤال را دوباره در متن بخوان.':key==='pick'||key==='listen'?'دوباره صدا را پخش کن و یک گزینهٔ دیگر انتخاب کن.':'این گزینه درست نیست؛ یک بار دیگر امتحان کن.';sfx(0)}})}show()};

profilePage=function(){INGAME=false;TAB='parents';const p=child(),st=profileStats(p),r=p.route||{unit:1,lesson:1};screen(`<div class="profile-heading"><span class="section-eyebrow">فضای یادگیری خانواده</span><h1>زبان‌آموزهای ما</h1><p>هر نفر، مسیر و کارنامهٔ خودش را دارد.</p></div><section class="profile-current"><div class="profile-avatar big-avatar" aria-hidden="true">${E(p.avatar)}</div><div><span class="profile-active-label">در حال یادگیری</span><h2>${E(p.name)}</h2><p class="profile-route">یونیت ${profileNumber(r.unit||1)} · درس ${profileNumber(r.lesson||1)}</p><div class="profile-actions"><button class="cta" onclick="resumeLearning()">ادامهٔ یادگیری</button><button onclick="profileEditor('${p.id}')">ویرایش پروفایل</button></div></div></section><div class="profile-stats"><div><b>${profileNumber(st.activities)}</b><span>تمرین با امتیاز ثبت‌شده</span></div><div><b>${profileNumber(st.stars)}</b><span>ستارهٔ جمع‌شده</span></div><div><b>${profileNumber(st.days)}</b><span>روز فعالیت ثبت‌شده</span></div></div><div class="profile-list-heading"><h2>انتخاب زبان‌آموز</h2><span>${profileNumber(KDB.profiles.length)} از ۸ پروفایل</span></div><div class="profile-grid">${KDB.profiles.map(x=>{const s=profileStats(x),active=x.id===KDB.active;return `<article class="learner-card ${active?'selected':''}"><div class="learner-title"><span class="profile-avatar" aria-hidden="true">${E(x.avatar)}</span><div><h3>${E(x.name)}</h3><span>${active?'✓ انتخاب فعلی':`یونیت ${profileNumber(x.route.unit||1)} · درس ${profileNumber(x.route.lesson||1)}`}</span></div></div><p>${s.activities?`${profileNumber(s.activities)} تمرین · ${profileNumber(s.stars)} ستاره`:'آمادهٔ اولین قدم'}</p><div class="profile-actions"><button class="${active?'ghost':'cta'}" onclick="switchProfile('${x.id}')">${active?'رفتن به خانهٔ من':'انتخاب این زبان‌آموز'}</button><button class="ghost" aria-label="ویرایش پروفایل ${E(x.name)}" onclick="profileEditor('${x.id}')">ویرایش</button></div></article>`}).join('')}<button class="new-profile-card" onclick="profileEditor()" ${KDB.profiles.length>=8?'disabled':''}><span aria-hidden="true">＋</span><b>زبان‌آموز جدید</b><small>${KDB.profiles.length>=8?'ظرفیت ۸ پروفایل پر شده':'نام و شخصیت دلخواهش را انتخاب کن'}</small></button></div><section class="profile-storage"><div><b>اطلاعات روی همین دستگاه می‌ماند</b><p>پیش از پاک‌کردن مرورگر یا جابه‌جایی سایت، پشتیبان بگیر.</p></div><div class="profile-actions"><button onclick="exportBackup()">دریافت پشتیبان</button><button onclick="backupImportPage()">بازگرداندن پشتیبان</button></div></section><button class="ghost" onclick="go('parents')">گزارش والدین</button>`);document.body.setAttribute('data-theme','profiles')};
profileEditor=function(id=null){const p=id?KDB.profiles.find(x=>x.id===id):null;if(id&&!p)return;if(!p&&KDB.profiles.length>=8)return toast('حداکثر ۸ پروفایل می‌توان ساخت.');PROFILE_EDIT=p?p.id:null;PROFILE_AVATAR=p?p.avatar:'🦊';INGAME=false;TAB='parents';screen(`<div class="profile-editor"><button class="ghost" onclick="profilePage()">برگشت به پروفایل‌ها</button><h1>${p?'ویرایش پروفایل':'یک دوست تازه'}</h1><div class="profile-avatar big-avatar" id="profile-avatar-preview" aria-hidden="true">${E(PROFILE_AVATAR)}</div><label for="profile-name">نام کوچک یا نام مستعار</label><input id="profile-name" maxlength="24" autocomplete="off" placeholder="مثلاً: رها" aria-describedby="profile-error"><p class="field-note">این نام در خوشامدگویی و کارنامه نمایش داده می‌شود.</p><fieldset class="avatar-fieldset"><legend>شخصیت دلخواه</legend><div class="avatar-picker">${PROFILE_AVATARS.map(a=>`<button class="avatar-option" data-avatar="${a}" aria-label="${({'🦊':'روباه','🐼':'پاندا','🐰':'خرگوش','🦁':'شیر','🐨':'کوالا','🐸':'قورباغه'})[a]}" aria-pressed="${a===PROFILE_AVATAR}" onclick="chooseProfileAvatar('${a}')">${a}</button>`).join('')}</div></fieldset><p id="profile-error" class="profile-error" role="alert"></p><div class="profile-actions"><button class="cta" onclick="saveProfileEditor()">${p?'ذخیرهٔ تغییرات':'ساخت پروفایل و شروع'}</button><button class="ghost" onclick="profilePage()">انصراف</button></div>${p?'<p class="field-note">تغییر نام و شخصیت، پیشرفت و نوشته‌ها را تغییر نمی‌دهد.</p>':''}</div>`);document.getElementById('profile-name').value=p?p.name:'';document.body.setAttribute('data-theme','profiles')};
function chooseProfileAvatar(a){if(!PROFILE_AVATARS.includes(a))return;PROFILE_AVATAR=a;document.getElementById('profile-avatar-preview').textContent=a;document.querySelectorAll('.avatar-option').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.avatar===a)))}
function saveProfileEditor(){const name=document.getElementById('profile-name').value.trim().replace(/\s+/g,' '),error=document.getElementById('profile-error');if(!name){error.textContent='یک نام برای این زبان‌آموز بنویس.';return}if(name.length>24){error.textContent='نام باید حداکثر ۲۴ نویسه باشد.';return}if(KDB.profiles.some(p=>p.id!==PROFILE_EDIT&&p.name.toLocaleLowerCase()===name.toLocaleLowerCase())){error.textContent='این نام قبلاً استفاده شده؛ برای تشخیص راحت‌تر نام متفاوتی بنویس.';return}const backup=JSON.stringify(KDB);let id=PROFILE_EDIT;if(id){const p=KDB.profiles.find(p=>p.id===id);if(!p)return;p.name=name;p.avatar=PROFILE_AVATAR}else{if(KDB.profiles.length>=8){error.textContent='ظرفیت پروفایل‌ها پر شده است.';return}const p=blankProfile(name,PROFILE_AVATAR);KDB.profiles.push(p);KDB.active=p.id;id=p.id}if(!persist()){KDB=JSON.parse(backup);error.textContent='ذخیره نشد. تنظیمات مرورگر را بررسی و دوباره تلاش کن.';return}if(PROFILE_EDIT)profilePage();else switchProfile(id)}
// Page colors use logo violet, mint, warm cream and peach; feedback colors stay semantic.
const THEME_BY_TAB={home:'home',books:'books',book:'books',lessons:'lessons',practice:'practice',videos:'videos',progress:'progress',parents:'parents',pricing:'pricing',about:'about',help:'parents'};
const themedScreenBase=screen;
screen=function(html,back){document.body.setAttribute('data-theme',THEME_BY_TAB[TAB]||'home');return themedScreenBase(html,back)};

function practiceWords(){return LESSON_PRACTICE&&[1,3].includes(lessonNumber())?lessonWords():ALL}
function finishLessonCards(){child().notes[`kidotalk-source-cards-${UNIT}-${lessonNumber()}`]='done';if([1,3].every(l=>child().notes[`kidotalk-source-cards-${UNIT}-${l}`]==='done'))S.cards=1;save();persist();setLessonMode('practice')}
const polishGo=go;
go=function(t){LESSON_PRACTICE=false;polishGo(t)};
const polishStart=start;
start=function(k){LESSON_PRACTICE=false;if(UNIT===1&&k==='read')return launchLessonActivity(k);polishStart(k)};
const polishSelect=selectUnit;
selectUnit=function(n,t='lessons'){if(!Number.isInteger(n)||n<1||n>15)return;if(n!==UNIT)LESSON_MODE='learn';polishSelect(n,t);if(n===1){if(!PR.includes('read'))PR=[...PR,'read'];if(!ACTS.some(a=>a[0]==='read'))ACTS=[...ACTS,['read','Reading','متن را بخوان و پاسخ بده','📖']];if(READY_LOCAL)go(t)}};
const polishSkills=skillReportData;
skillReportData=function(){const rows=polishSkills();if(UNIT===1){const row=rows.find(r=>r[3].includes('abcd'));if(row&&!row[3].includes('read'))row[3]=[...row[3],'read']}return rows};
const polishProgress=progressPage;
progressPage=function(){const saved=VIDS,render=screen;VIDS=unitVideos().map(v=>[v.title,v.note||'',v.url]);const latest={};for(const h of child().history)if(h.unit===UNIT&&h.key!=='mem'&&!h.practiceOnly&&!['daily','review'].includes(h.key))latest[h.key]=h;const recent=Object.values(latest),total=recent.reduce((s,h)=>s+(h.total||1),0),accuracy=total?Math.round(recent.reduce((s,h)=>s+(h.accuracy/100)*(h.total||1),0)/total*100):null;screen=function(html,back){const metrics=`<section class="accuracy-panel"><b>${accuracy===null?'—':accuracy+'٪'}</b><div><strong>دقت پاسخ‌های مستقل</strong><p>${accuracy===null?'با انجام تمرین‌ها ثبت می‌شود.':'بر اساس آخرین تلاش ثبت‌شدهٔ هر تمرین؛ بازی حافظه در این درصد نیست.'}</p></div></section>`;return render(metrics+html.replace('پیشرفت کلی:','پیشرفت فعالیت‌ها:'),back)};try{polishProgress()}finally{VIDS=saved;screen=render}};
const polishImport=validateImport;
validateImport=function(data){const profiles=polishImport(data);profiles.forEach((p,i)=>{const x=data.profiles[i],u=p.route.unit,max=u===2||u>=4?7:6,l=Number(x.route&&x.route.lesson);p.route.lesson=Number.isInteger(l)&&l>=1&&l<=max?l:1;p.route.tab=safeTab(x.route&&x.route.tab);const j=x.journey,count=j&&j.unit>=4&&COURSE[j.unit]?COURSE[j.unit].vocab.length:j&&j.unit===3?Object.keys(BODY3).length:10;if(j&&Number.isInteger(j.unit)&&j.unit>=1&&j.unit<=15&&Number.isInteger(j.step)&&j.step>=0&&j.step<5&&Number.isInteger(j.offset)&&j.offset>=0&&j.offset<count)p.journey={unit:j.unit,step:j.step,offset:j.offset}});return profiles};
function unitActivityKeys(u){return u===1?[...new Set([...U1.PR,'read'])]:u===2?ACTS2.slice(1).map(a=>a[0]):u===3?ACTS3.slice(1).map(a=>a[0]):COURSE_ACTS.slice(1).map(a=>a[0])}
function menuProgress(u){const s=child().units[u]||{},keys=unitActivityKeys(u);return {done:keys.filter(k=>s[k]>0).length,total:keys.length}}
unitSwitch=function(){const l=lessonNumber(),count=UNIT===2||UNIT>=4?7:6,icons=['🖼️','💬','🧸','🔤','📖','✍️','⭐'];return `<details class="learning-menu" id="learning-menu"><summary><span class="menu-hamburger" aria-hidden="true"><i></i><i></i><i></i></span><span class="menu-summary-text"><b>درس‌ها و یونیت‌ها</b><small>یونیت ${UNIT} · ${E(LESSON_NAMES[l-1]||'درس تکمیلی')}</small></span><span class="menu-chevron" aria-hidden="true">⌄</span></summary><div class="learning-menu-body"><div class="menu-book"><span aria-hidden="true">📚</span><div><b class="en">Family and Friends 1</b><small>مسیر یادگیری خودت را انتخاب کن</small></div><button class="ghost" onclick="go('book')">کتاب من</button></div><h2>درس‌های یونیت ${UNIT}</h2><div class="menu-lessons">${Array.from({length:count},(_,i)=>`<button class="menu-lesson ${l===i+1?'selected':''}" ${l===i+1?'aria-current="page"':''} onclick="jumpLesson(${i+1})"><span class="menu-lesson-icon" aria-hidden="true">${icons[i]}</span><span><small>درس ${i+1}</small><b>${E(LESSON_NAMES[i]||'تکمیلی')}</b></span><span class="menu-current">${l===i+1?'اینجایی':'←'}</span></button>`).join('')}</div><h2>یونیت‌های کتاب</h2><div class="menu-units">${Object.entries(COURSE_TITLES).map(([n,t])=>{const p=menuProgress(+n);return `<button class="menu-unit ${+n===UNIT?'selected':''}" ${+n===UNIT?'aria-current="page"':''} onclick="openMenuUnit(${n})"><span class="menu-unit-number">${n}</span><span><b class="en">${E(t[0])}</b><small>${E(t[1])}</small><span class="menu-unit-meter" aria-hidden="true"><i style="width:${Math.round(p.done/p.total*100)}%"></i></span><small>${p.done} از ${p.total} تمرین</small></span></button>`}).join('')}</div></div></details>`};
function openMenuUnit(n){child().route.lesson=1;LESSON_MODE='learn';selectUnit(n,'lessons');window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const menu=document.getElementById('learning-menu');if(menu&&menu.open){menu.open=false;const summary=menu.querySelector('summary');if(summary)summary.focus()}}});

READY_LOCAL=true;RESTORING=true;
selectUnit(child().route.unit||1,'home');
restoreRoute();RESTORING=false;

</script>
